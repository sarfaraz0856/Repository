<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;}
html,body{width:2560px;height:1440px;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif;}
.bg{width:2560px;height:1440px;background:linear-gradient(120deg,#1f3a93 0%,#4a1d8f 55%,#6c2bd9 100%);position:relative;display:flex;align-items:center;justify-content:center;}
.bg:before{content:"";position:absolute;width:900px;height:900px;border-radius:50%;background:rgba(255,255,255,.05);top:-200px;left:-150px;}
.bg:after{content:"";position:absolute;width:700px;height:700px;border-radius:50%;background:rgba(255,255,255,.05);bottom:-200px;right:-100px;}
/* safe area 1546x423 centered */
.safe{width:1546px;height:423px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:2;}
.logo{width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#ff3b3b,#ffd400);display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:900;color:#13131f;margin-bottom:18px;box-shadow:0 10px 40px rgba(0,0,0,.35);}
.title{font-size:118px;font-weight:900;letter-spacing:2px;line-height:1;text-shadow:0 8px 24px rgba(0,0,0,.35);}
.tag{font-size:46px;font-weight:600;margin-top:18px;opacity:.95;}
.pill{margin-top:22px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);border-radius:40px;padding:12px 40px;font-size:38px;font-weight:700;}
</style></head><body>
<div class="bg">
  <div class="safe">
    <div class="logo">SL</div>
    <div class="title">SMART LEARNING HINDI</div>
    <div class="tag">Tech · YouTube · Online Earning — Hindi mein</div>
    <div class="pill">🔔 Har Hafte Nayi Video</div>
  </div>
</div>
</body></html>
