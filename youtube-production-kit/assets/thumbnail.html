<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;}
html,body{width:1280px;height:720px;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif;}
.wrap{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;}
.left{flex:1.35;background:linear-gradient(135deg,#d31027 0%,#8a0b1c 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:70px 60px;position:relative;}
.year{background:#ffd400;color:#13131f;font-weight:900;font-size:34px;padding:6px 22px;border-radius:12px;width:fit-content;letter-spacing:1px;}
.big{font-size:96px;font-weight:900;line-height:.98;margin-top:26px;text-shadow:0 6px 18px rgba(0,0,0,.3);}
.sub{font-size:58px;font-weight:900;color:#ffd400;margin-top:14px;text-shadow:0 4px 12px rgba(0,0,0,.3);}
.dot{position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.06);top:-120px;right:-120px;}
.right{flex:.85;background:radial-gradient(circle at 50% 40%,#2a2a40,#0d0d16);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative;}
.phone{width:230px;height:430px;border:12px solid #1f1f2e;border-radius:38px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.play{width:120px;height:84px;background:#ff0000;border-radius:22px;display:flex;align-items:center;justify-content:center;}
.play:after{content:"";border-left:40px solid #fff;border-top:26px solid transparent;border-bottom:26px solid transparent;margin-left:8px;}
.hand{font-size:70px;margin-top:18px;}
.badge{position:absolute;bottom:26px;right:26px;background:#ffd400;color:#13131f;font-weight:900;font-size:26px;padding:8px 20px;border-radius:30px;transform:rotate(-6deg);box-shadow:0 8px 20px rgba(0,0,0,.4);}
</style></head><body>
<div class="wrap">
  <div class="left">
    <div class="dot"></div>
    <div class="year">2026</div>
    <div class="big">MOBILE SE<br>YOUTUBE<br>CHANNEL</div>
    <div class="sub">Kaise Banaye?</div>
  </div>
  <div class="right">
    <div class="phone"><div class="play"></div><div class="hand">👆</div></div>
    <div class="badge">STEP BY STEP</div>
  </div>
</div>
</body></html>
