<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;}
html,body{width:800px;height:800px;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif;}
.wrap{width:800px;height:800px;background:radial-gradient(circle at 50% 35%,#6c2bd9,#1f3a93);display:flex;align-items:center;justify-content:center;}
.badge{width:620px;height:620px;border-radius:50%;background:linear-gradient(135deg,#d31027,#8a0b1c);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 20px 70px rgba(0,0,0,.4);border:14px solid rgba(255,255,255,.9);}
.mono{font-size:300px;font-weight:900;line-height:.8;letter-spacing:-6px;}
.txt{font-size:52px;font-weight:800;letter-spacing:4px;margin-top:6px;color:#ffd400;}
</style></head><body>
<div class="wrap"><div class="badge"><div class="mono">SL</div><div class="txt">HINDI</div></div></div>
</body></html>
