<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Tutorial Ep 01 – Full Video Renderer (v3)</title>
<!--
  Full-length episode renderer. Everything is timed from the narration timing file (window.TIM, injected by
  scripts/render_frames_v3.js): each scene starts/ends with its narration and each cue references a phrase id.
  Base footage: the user's real Claude home screen (claude_home_pro_plate.png). Terminal scenes: genuine
  Claude Code CLI recordings (recordings/claude_code_v3_*.mp4). All on-screen explanatory text is English.
  Captions are NOT drawn here; they are burned in afterwards from the English SRT (ASS) by assemble_v3.sh.
-->
<style>
  @font-face{font-family:"Newsreader";src:url(fonts/newsreader-latin-400-normal.woff2) format("woff2");font-weight:400}
  @font-face{font-family:"Newsreader";src:url(fonts/newsreader-latin-500-normal.woff2) format("woff2");font-weight:500}
  :root{--bg:#191919;--panel:#232322;--panel2:#2A2A28;--line:#3a3936;--text:#F0EEE6;--mute:#A8A49B;--accent:#D97757;--ok:#7BC48A;--warn:#E8B04B}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
  .layer{position:absolute;inset:0}
  /* real UI */
  #cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  #plate{position:absolute;left:0;top:0;width:1920px;height:1080px}
  .hover{position:absolute;border-radius:8px;background:rgba(255,255,255,.065);opacity:0}
  .hl{position:absolute;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 0 4px rgba(217,119,87,.18);opacity:0;pointer-events:none}
  .tag{position:absolute;white-space:nowrap;background:var(--panel2);border:1px solid #45433f;color:var(--text);font:600 17px Inter;padding:7px 12px 7px 26px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .tag::before{content:"";position:absolute;left:11px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--accent)}
  #cursor{position:absolute;left:0;top:0;width:24px;height:36px;opacity:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .ripple{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid rgba(240,238,230,.9);opacity:0}
  /* info cards (screen space) */
  .card{position:absolute;background:rgba(35,35,34,.97);border:1px solid var(--line);border-radius:16px;padding:26px 30px;color:var(--text);box-shadow:0 24px 60px rgba(0,0,0,.5);opacity:0}
  .card .k{font:700 15px Inter;letter-spacing:.22em;color:var(--accent);margin-bottom:8px}
  .card h2{font:500 44px Newsreader;letter-spacing:-.005em;margin-bottom:8px;line-height:1.05}
  .card .lead{font:500 22px Inter;color:#DCD9D0;line-height:1.35;margin-bottom:16px}
  .card h4{font:700 14px Inter;letter-spacing:.18em;color:var(--mute);margin:16px 0 8px}
  .card ul{list-style:none}
  .card li{font:400 20px Inter;color:var(--text);line-height:1.38;padding-left:22px;position:relative;margin:5px 0}
  .card li::before{content:"";position:absolute;left:3px;top:11px;width:7px;height:7px;border-radius:2px;background:var(--accent)}
  .card ol{list-style:none;counter-reset:s}
  .card ol li{padding-left:40px}
  .card ol li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:7px;top:0;left:0;background:var(--panel2);border:1px solid var(--line);color:var(--accent);font:700 14px Inter;display:flex;align-items:center;justify-content:center}
  .card .pill{display:inline-block;margin-top:14px;margin-right:6px;padding:6px 11px;border-radius:7px;font:600 15px Inter;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
  .card .pill b{color:var(--accent)}
  .card code{font:500 17px "JetBrains Mono",monospace;background:#151514;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:#ECEAE3}
  .card .codeblk{font:500 17px "JetBrains Mono",monospace;background:#141413;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:#ECEAE3;margin:6px 0 10px;white-space:pre}
  .card .codeblk .c{color:var(--mute)}
  .two{display:flex;gap:16px}
  .two > div{flex:1;background:#1d1d1c;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .two h3{font:700 22px Inter;margin-bottom:6px}
  .scale{display:flex;gap:6px;margin:8px 0 4px}
  .scale span{flex:1;text-align:center;padding:8px 0;border-radius:7px;background:#1d1d1c;border:1px solid var(--line);font:600 16px Inter;color:var(--mute)}
  .scale span.on{border-color:var(--accent);color:var(--text);background:rgba(217,119,87,.14)}
  /* section tag */
  #sect{position:absolute;left:50%;top:24px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(35,35,34,.95);border:1px solid var(--line);padding:8px 16px;border-radius:10px;color:var(--text);font:600 17px Inter;opacity:0;white-space:nowrap}
  #sect b{color:var(--accent);font-weight:700}
  #sect .live{display:none;align-items:center;gap:7px;color:var(--mute);font-weight:500;padding-left:12px;border-left:1px solid var(--line)}
  #sect .live i{width:8px;height:8px;border-radius:50%;background:#4ADE80;display:block}
  /* full-screen title layers */
  .full{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
  .full .t{font:400 104px Newsreader;color:var(--text);letter-spacing:-.01em;text-align:center}
  .full .t em{font-style:normal;color:var(--accent)}
  .full .s{margin-top:20px;font:600 21px Inter;color:var(--accent);letter-spacing:.34em}
  .full .card li{font-size:27px;margin:9px 0}
  .full .card li::before{top:15px;width:9px;height:9px}
  .full .card h2{font-size:60px}
  .full .card .lead{font-size:26px}
  .full .card h3{font-size:27px}
  .full .card .pill{font-size:19px}
  .full .card .k{font-size:17px}
  .full .card .codeblk{font-size:20px}
  .full .card code{font-size:22px}
  .backdrop{position:absolute;inset:0;background:radial-gradient(1100px 620px at 50% 45%,rgba(22,22,21,.9),rgba(22,22,21,.55))}
  #chapters{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-top:44px;width:1000px}
  .ch{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font:600 22px Inter;color:var(--text);opacity:0}
  .ch b{color:var(--accent);font:700 18px Inter;width:30px}
  /* terminal */
  #termScene{opacity:0}
  #tWin{position:absolute;border-radius:12px;overflow:hidden;background:#141413;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.55);transform-origin:0 0}
  #tBar{height:40px;background:#262624;display:flex;align-items:center;gap:8px;padding-left:16px;position:relative}
  #tBar .dot{width:12px;height:12px;border-radius:50%}
  #tBar .lbl{position:absolute;left:0;right:0;text-align:center;font:500 15px Inter;color:var(--mute)}
  #tBody{position:absolute;left:0;top:40px;width:1532px;height:900px}
  #termA,#termB{position:absolute;left:0;top:0;width:1532px;height:900px}
  .thl{position:absolute;border:3px solid var(--accent);border-radius:10px;box-shadow:0 0 0 5px rgba(217,119,87,.2);opacity:0}
  .thl .tag{font-size:22px}
  #ff{position:absolute;padding:12px 18px;border-radius:10px;background:var(--panel2);border:1px solid var(--accent);color:var(--text);font:600 21px Inter;opacity:0}
  #ff span{color:var(--mute);font-weight:500;margin-left:6px}
  #dim{position:absolute;inset:0;background:rgba(10,10,10,.72);opacity:0}
  /* end */
  #eps{display:flex;gap:10px;margin-top:40px;flex-wrap:wrap;justify-content:center;width:1300px}
  .ep{padding:9px 16px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--mute);font:500 20px Inter;opacity:0}
  #btns{display:flex;gap:16px;margin-top:44px}
  .btn{display:flex;align-items:center;gap:12px;font:700 25px Inter;padding:13px 28px;border-radius:10px;opacity:0}
  #likeBtn{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  #subBtn{background:#CC0000;color:#fff}
</style>
</head>
<body>
<div id="stage">
  <div id="uiScene" class="layer">
    <div id="cam">
      <img id="plate" src="claude_home_pro_plate.png" alt="">
      <div id="hoverLayer"></div>
      <div id="hlLayer"></div>
      <div class="ripple" id="rip"></div>
      <svg id="cursor" viewBox="0 0 24 36"><path d="M1.5 1.5 L1.5 27 L7.6 21.2 L11.6 31.2 L15.6 29.5 L11.7 19.8 L19.8 19.8 Z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <div id="termScene" class="layer">
    <div id="tWin"><div id="tBar"><div class="dot" style="background:#FF5F57"></div><div class="dot" style="background:#FEBC2E"></div><div class="dot" style="background:#28C840"></div><div class="lbl">Terminal — ~/todo-app (demo project)</div></div>
      <div id="tBody"><img id="termA" alt=""><img id="termB" alt=""><div id="thlLayer"></div></div></div>
    <div id="dim"></div>
    <div id="ff">⏩ Fast-forward<span>Claude Code is working…</span></div>
  </div>
  <div id="fullLayer"></div>
  <div id="cardLayer"></div>
  <div id="sect"><span id="sectTx"></span><span class="live"><i></i>Real recording · Claude Code CLI v2.1.310</span></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOut=x=>1-Math.pow(1-x,3);
function win(t,a,b,d=.25){if(t<a-d||t>b+d)return 0;if(t<a)return easeOut((t-(a-d))/d);if(t>b)return 1-easeOut((t-b)/d);return 1}
function ramp(t,a,b){return ease(clamp((t-a)/(b-a),0,1))}
function kf(K,t){if(t<=K[0][0])return K[0].slice(1);for(let i=0;i<K.length-1;i++){const A=K[i],B=K[i+1];if(t<=B[0]){const u=B[0]>A[0]?ease((t-A[0])/(B[0]-A[0])):1;return A.slice(1).map((v,j)=>v+(B[j+1]-v)*u)}}return K[K.length-1].slice(1)}
function lin(K,x){if(x<=K[0][0])return K[0][1];for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1];if(x<=b[0])return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}return K[K.length-1][1]}

let PH={}, SC={};          // phrase id -> {start,end}; scene id -> {start,end}
const S=id=>PH[id].start, E=id=>PH[id].end;

/* ---------- plate geometry (plate px) ---------- */
const R={ side:[4,42,280,370], newb:[6,47,273,36], search:[6,81,273,36], proj:[6,115,273,36], art:[6,149,273,36], code:[6,183,273,36],
  cust:[6,217,273,36], usage:[6,255,273,34], hist:[6,307,273,66], acct:[6,1038,276,36], ghost:[1883,8,30,30],
  input:[772,366,664,119], plus:[782,435,32,32], mode:[817,434,132,34], model:[1186,433,152,34], voice:[1343,436,84,30], chips:[857,517,494,36] };
const ctr=r=>[r[0]+r[2]*0.42, r[1]+r[3]*0.55];

/* ---------- English info cards ---------- */
const CARDS={
 new:{side:'R',k:'SIDEBAR',h:'New chat',lead:'Starts a fresh conversation.',body:`<ul><li>Each chat keeps its own conversation</li><li>Start a new chat for each new topic</li><li>Focused chats give more focused answers</li></ul>`},
 search:{side:'R',k:'SIDEBAR',h:'Search',lead:'Find your past chats quickly.',body:`<ul><li><b>Chat search</b> (paid plans): ask Claude <i>“What did we discuss about…?”</i></li><li>On/off: Settings › Your Claude › <i>Search and reference chats</i></li><li>Incognito chats are never searched</li></ul>`},
 projects:{side:'R',k:'SIDEBAR',h:'Projects',lead:'A workspace with its own files (knowledge) and instructions.',body:`<h4>HOW TO CREATE</h4><ol><li>Projects › <b>+ New Project</b></li><li>Add a name and description</li><li>Add files to project knowledge with <b>+</b></li><li><b>Set project instructions</b> › Save</li></ol><h4>GOOD TO KNOW</h4><ul><li>Chats share the project knowledge, not each other’s conversations</li><li>Paid plans: bigger knowledge with RAG (up to 10×)</li><li>Sharing projects: Team &amp; Enterprise only</li></ul>`},
 artifacts:{side:'R',k:'SIDEBAR',h:'Artifacts',lead:'Work Claude creates in a side panel: docs, code, websites, diagrams, dashboards.',body:`<ul><li>All of them are saved on the <b>Artifacts</b> page</li><li>Edit them by chatting, or edit templates directly</li><li>Export Docs to Word, PDF, Markdown or Google Docs</li><li>Private by default; you choose when to share</li></ul><h4>REQUIREMENTS &amp; LIMITS</h4><ul><li>Settings: <i>Code execution and file creation</i> must be on</li><li>Storage: up to 20 MB per artifact</li></ul>`},
 code:{side:'R',k:'SIDEBAR',h:'Claude Code',lead:'An agentic coding tool: reads your code, edits files and runs commands.',body:`<h4>ON THE WEB (claude.ai/code)</h4><ol><li>Connect your GitHub account</li><li>Pick a repository</li><li>Describe the task</li><li>Review the diff › <b>Create PR</b></li></ol><ul><li>Also available in the Terminal, VS Code, JetBrains and the Desktop app</li></ul><span class="pill"><b>Pro</b> · included</span><span class="pill">Counts toward usage limits</span>`},
 customize:{side:'R',k:'SIDEBAR',h:'Customize',lead:'Add abilities and connections to Claude.',body:`<ul><li><b>Skills</b>: teach Claude how to do specific tasks</li><li><b>Connectors</b>: link outside services (click Connect, then sign in)</li><li><b>Plugins</b>: bundles of skills and commands</li><li>Browse everything in the <b>Discover</b> tab</li></ul>`},
 usage:{side:'R',k:'SIDEBAR',h:'Usage',lead:'See how much of your plan you have used.',body:`<ul><li>Full dashboard: Settings › Usage</li><li>Session limit resets every <b>5 hours</b></li><li>There is also a <b>weekly</b> limit</li><li>Optional usage credits let you keep working</li><li>Tip: lower effort uses less</li></ul>`},
 history:{side:'R',k:'SIDEBAR',h:'Chats and tasks',lead:'Your recent chats and tasks.',body:`<ul><li><b>View all</b> opens the full list</li><li>Hover a chat › <b>⋮</b> › Rename or Delete</li><li>Select several chats to delete them together</li></ul>`},
 account:{side:'R',k:'SIDEBAR',h:'Account & Settings',lead:'Click your name (bottom-left) › Settings.',body:`<ul><li><b>Appearance</b>: theme and look</li><li><b>Your Claude</b>: memory and chat search</li><li><b>Usage</b>: limits and usage credits</li></ul><span class="pill">Shows your plan: <b>Pro</b></span>`},
 incognito:{side:'L',k:'TOP-RIGHT',h:'Incognito chat',lead:'Click the ghost icon in a new chat.',body:`<ul><li>Not saved to history or memory</li><li>Not used for model training</li><li>Can’t be reopened once closed: save what you need</li><li>Not available inside projects</li></ul>`},
 msgbox:{side:'R',k:'MESSAGE BOX',h:'Write a clear prompt',lead:'Type your question or task here.',body:`<ul><li>Say <b>what</b> you want, <b>for whom</b>, and in <b>what format</b></li></ul><div class="codeblk">“Explain Python lists to a beginner,
with 3 short examples.”</div><span class="pill">Clear prompt = better answer</span>`},
 plus:{side:'R',k:'MESSAGE BOX',h:'The + menu',lead:'Choose <b>Add files or photos</b> to attach files.',body:`<ul><li>Docs: PDF, DOCX, CSV, TXT, HTML, JSON, XLSX*</li><li>Images: JPEG, PNG, GIF, WebP</li><li>Up to 20 files per chat, 500 MB each</li><li>Drag &amp; drop or paste also work</li><li>Turn memory off for one chat (before the first message)</li></ul><span class="pill">*XLSX needs code execution enabled</span>`},
 cowork:{side:'R',k:'MESSAGE BOX',h:'Chat vs Cowork',lead:'Pick how Claude should work.',body:`<div class="two"><div><h3>Chat</h3><ul><li>Quick questions and answers</li></ul></div><div><h3>Cowork</h3><ul><li>Hand over a whole task</li><li>Research, read files, make spreadsheets &amp; slides</li></ul></div></div><ul style="margin-top:12px"><li>Cowork: paid plans, uses more usage</li><li>Local files &amp; browser need the Claude Desktop app</li><li>Check its permission setting before it acts</li></ul>`},
 model:{side:'R',k:'MESSAGE BOX',h:'Model & Effort',lead:'Click <b>Opus 5.5 · Medium</b> to change them.',body:`<ul><li>Switch models; <b>More models</b> shows extra options</li></ul><h4>EFFORT</h4><div class="scale"><span>Low</span><span class="on">Medium</span><span>High</span><span>Extra high</span><span>Max</span></div><ul><li>Higher effort: deeper answers, but slower and uses more</li><li>Medium: everyday tasks · High and above: hard coding &amp; planning</li><li>Opus 5.5 always thinks before it answers</li></ul>`},
 voice:{side:'R',k:'MESSAGE BOX',h:'Voice & quick starts',lead:'More ways to begin.',body:`<ul><li><b>Mic / voice</b> buttons: speak instead of typing</li><li><b>Write · Learn · Code · Life stuff · Claude’s choice</b>: ideas to get started</li></ul>`},
};

/* ---------- per-scene setup ---------- */
// camera: [scale, focusX, focusY] (focus clamped so the view never leaves the plate; 0 = left/top edge, 9999 = right/bottom edge)
const SIDE_TOP=[1.45,0,0], SIDE_BOT=[1.45,0,9999], MSG=[1.25,1152,430];
const SCN={
 intro:{cam:[1.06,1104,420],chap:null},
 home:{cam:[1,960,540],chap:['01','Home screen']},
 new:{cam:SIDE_TOP,chap:['02','Sidebar · New'],cur:'newb',hl:['newb','New chat'],click:true},
 search:{cam:SIDE_TOP,chap:['02','Sidebar · Search'],cur:'search',hl:['search','Search']},
 projects:{cam:SIDE_TOP,chap:['02','Sidebar · Projects'],cur:'proj',hl:['proj','Projects']},
 artifacts:{cam:SIDE_TOP,chap:['02','Sidebar · Artifacts'],cur:'art',hl:['art','Artifacts']},
 code:{cam:SIDE_TOP,chap:['02','Sidebar · Code'],cur:'code',hl:['code','Claude Code']},
 customize:{cam:SIDE_TOP,chap:['02','Sidebar · Customize'],cur:'cust',hl:['cust','Customize']},
 usage:{cam:SIDE_TOP,chap:['02','Sidebar · Usage'],cur:'usage',hl:['usage','Usage']},
 history:{cam:SIDE_TOP,chap:['02','Sidebar · Chats and tasks'],cur:'hist',hl:['hist','Chats and tasks']},
 account:{cam:SIDE_BOT,chap:['02','Sidebar · Account'],cur:'acct',hl:['acct','Your name › Settings']},
 incognito:{cam:[1.6,9999,0],chap:['02','Incognito chat'],cur:'ghost',hl:['ghost','Incognito']},
 msgbox:{cam:MSG,chap:['03','Message box'],cur:'input',hl:['input','Message box']},
 plus:{cam:MSG,chap:['03','Message box · + menu'],cur:'plus',hl:['plus','+ Add files or photos']},
 cowork:{cam:MSG,chap:['03','Message box · Chat / Cowork'],cur:'mode',hl:['mode','Chat · Cowork']},
 model:{cam:MSG,chap:['04','Model & effort'],cur:'model',hl:['model','Model · Effort']},
 voice:{cam:MSG,chap:['03','Voice & quick starts'],cur:'voice',hl:['voice','Mic · Voice']},
};
const UI_SCENES=['intro','home','new','search','projects','artifacts','code','customize','usage','history','account','incognito','msgbox','plus','cowork','model','voice'];

let CAM=[], CUR=[], CLICKS=[], HLS=[], HOVERS=[], CARDEL={};
function addHL(rect,label,a,b,tagPos){
  const d=document.createElement('div'); d.className='hl';
  Object.assign(d.style,{left:rect[0]+'px',top:rect[1]+'px',width:rect[2]+'px',height:rect[3]+'px'});
  if(label){const g=document.createElement('div');g.className='tag';g.textContent=label;
    const p=tagPos||'right'; if(p==='right')Object.assign(g.style,{left:(rect[2]+12)+'px',top:'-2px'});
    else if(p==='above')Object.assign(g.style,{left:'-4px',top:'-50px'}); else if(p==='below')Object.assign(g.style,{left:'-4px',top:(rect[3]+10)+'px'});
    else if(p==='left')Object.assign(g.style,{right:(rect[2]+12)+'px',top:'-2px'});
    d.appendChild(g)}
  $('hlLayer').appendChild(d); HLS.push([d,a,b]);
}
function addHover(rect,a,b){const d=document.createElement('div');d.className='hover';Object.assign(d.style,{left:rect[0]+2+'px',top:rect[1]+'px',width:rect[2]-4+'px',height:rect[3]+'px'});$('hoverLayer').appendChild(d);HOVERS.push([d,a,b])}
function addCard(id,a,b){
  const c=CARDS[id]; const d=document.createElement('div'); d.className='card';
  d.innerHTML=`<div class="k">${c.k}</div><h2>${c.h}</h2><div class="lead">${c.lead}</div>${c.body}`;
  if(c.side==='R')Object.assign(d.style,{left:(SCN[id].cam===MSG?1372:1214)+'px',top:'118px',width:(SCN[id].cam===MSG?510:660)+'px'});
  else Object.assign(d.style,{left:'70px',top:'170px',width:'640px'});
  $('cardLayer').appendChild(d); CARDEL[id]=[d,a,b];
}
function fullLayer(html){const d=document.createElement('div');d.className='full';d.innerHTML=html;$('fullLayer').appendChild(d);return d}

/* ---------- terminal timing (output time -> source seconds in each recording) ---------- */
let TA=[], TB=[], THL=[], FULLS={}, TLAYOUT=[];
function termHL(rec,rect,label,a,b,tagPos){
  const d=document.createElement('div'); d.className='thl';
  Object.assign(d.style,{left:rect[0]+'px',top:rect[1]+'px',width:rect[2]+'px',height:rect[3]+'px'});
  const g=document.createElement('div'); g.className='tag'; g.textContent=label;
  if(tagPos==='below')Object.assign(g.style,{right:'-3px',top:(rect[3]+10)+'px'}); else if(tagPos==='right')Object.assign(g.style,{left:(rect[2]+14)+'px',top:'0px'}); else Object.assign(g.style,{right:'-3px',top:'-52px'});
  d.appendChild(g); $('thlLayer').appendChild(d); THL.push([d,a,b,rec]);
}

window.init=function(){
  for(const p of TIM.timings) PH[p.id]=p; for(const s of TIM.scenes) SC[s.id]=s;
  // camera + cursor + highlights + cards for UI scenes
  CAM.push([0,1.06,1104,420]);

function renderUI(t){
  const last=SC.voice.end+0.6, vis=t<last; $('uiScene').style.display=vis?'block':'none'; if(!vis)return;
  $('uiScene').style.opacity=1-ramp(t,SC.voice.end,last);
  let [s,fx,fy]=kf(CAM,t); const hw=960/s,hh=540/s; fx=clamp(fx,hw,1920-hw); fy=clamp(fy,hh,1080-hh);
  $('cam').style.transform=`translate(${960-fx*s}px,${540-fy*s}px) scale(${s})`;
  const dim=1-ramp(t,SC.intro.end-0.6,SC.intro.end+0.4);
  $('cam').style.filter=dim>0.01?`brightness(${1-0.22*dim}) blur(${12*dim}px)`:'none';
  for(const [d,a,b] of HLS) d.style.opacity=win(t,a,b,.22);
  for(const [d,a,b] of HOVERS) d.style.opacity=win(t,a,b,.12);
  let [cx,cy]=kf(CUR,t); cx+=5*Math.sin(t*1.1)+2*Math.sin(t*2.3); cy+=4*Math.sin(t*0.8+1)+1.5*Math.sin(t*1.9);   // natural hand drift
  $('cursor').style.opacity=win(t,SC.home.start+0.3,SC.voice.end-0.3,.3);
  let r=0,rs=0; for(const c of CLICKS){const d=t-c;if(d>=0&&d<.4){r=1-d/.4;rs=.5+d/.4*.8}}
  $('cursor').style.transform=`translate(${cx-1}px,${cy-1}px)`+(r>.6?' scale(.9)':'');
  Object.assign($('rip').style,{left:cx+'px',top:cy+'px',opacity:r,transform:`scale(${rs})`});
}
function renderCards(t){
  for(const id in CARDEL){const [d,a,b]=CARDEL[id]; const o=win(t,a,b,.3); d.style.opacity=o; d.style.display=o>0?'block':'none'; d.style.transform=`translateY(${(1-o)*12 - 10*clamp((t-a)/(b-a),0,1)}px)`}
}
function showFull(el,o,dy=0,t=0,a=0,b=1){el.style.opacity=o; el.style.display=o>0?'flex':'none'; const z=1+0.045*clamp((t-a)/Math.max(b-a,0.1),0,1); el.style.transform=`translateY(${(1-o)*dy}px) scale(${z})`}
let lastA=null,lastB=null;
async function renderTerm(t){
  const ci=SC.cc_intro, ce=SC.cc_explain, cf=SC.cc_fix;
  const vis=t>=S('d2')-0.4 && t<cf.end+0.6; $('termScene').style.display=vis?'block':'none'; if(!vis)return;
  $('termScene').style.opacity=ramp(t,S('d2')-0.4,S('d2')+0.2)*(1-ramp(t,cf.end,cf.end+0.5));
  const [x,y,sc]=kf(TLAYOUT,t); const drift=1+0.025*(t<cf.start?ramp(t,ce.start,ce.end):ramp(t,cf.start,cf.end));
  Object.assign($('tWin').style,{left:x+'px',top:y+'px',width:'1532px',height:'940px',transform:`scale(${sc*drift})`});
  const useB=t>=cf.start-0.3; const wB=ramp(t,cf.start-0.3,cf.start+0.2);
  $('termA').style.opacity=1-wB; $('termB').style.opacity=wB;

  if(useB){const f=clamp(Math.round(lin(TB,t)*30)+1,1,975),p=window.DIR_B+'/f'+String(f).padStart(4,'0')+'.jpg'; if(p!==lastB){$('termB').src=p;lastB=p;await $('termB').decode().catch(()=>{})}}
  for(const [d,a,b,rec] of THL) d.style.opacity=win(t,a,b,.2)*((rec==='A')?(1-wB):wB);
  const ffA=win(t,S('epause'),E('epause'),.12), ffB=win(t,S('fpause'),E('fpause'),.12);
  Object.assign($('ff').style,{opacity:Math.max(ffA,ffB),left:'1420px',top:'150px'});
  $('dim').style.opacity=win(t,S('f5')-0.1,E('f5')+0.1,.3);
}

  $('bell').style.transform=t>t0?`rotate(${18*Math.sin((t-t0)*16)*Math.exp(-(t-t0)*2.2)}deg)`:'none';

  const tm=[['cc_explain','05','Claude Code · explain a project',1],['cc_fix','05','Claude Code · fix a bug',1],['cc_modes','05','Claude Code · permission modes',0],['limits','06','Limits & safe use',0]];
  for(const [id,n,l,lv] of tm){const s=SC[id];const w=win(t,s.start,s.end,.25);if(w>o){o=w;html=`<b>${n}</b>&nbsp; ${l}`;live=!!lv}}

  $('sect').style.opacity=o; $('sectTx').innerHTML=html; document.querySelector('#sect .live').style.display=live?'flex':'none';
}
